# Earnings Maps watchlist v1 (brief §6). Banks and insurers are out of v1.
#
# cik, fye_sec   confirmed with SEC data by scripts/verify_watchlist.py (`verified: true`)
# fye            the fiscal-year-end rule in words; fye_sec is SEC's MMDD from the latest filing
# ir_url         many IR sites block scripts (HTTP 403), so these are checked by hand
# tables/lines/segments   this company's mapping: labels exactly as printed in its release.
#                Companies without one get it at their first /earnings-ingest (the parser
#                lists the release's rows when a label is missing).
# Nothing here is a number shown on screen; numbers come only from the filings.
#
# Known shape differences (from the brief): Visa and McDonald's print no cost-of-revenue
# or gross-profit line; Amazon prints cost of sales but no gross profit (show it only as
# "our calculation").

companies:
  - ticker: AAPL
    name: Apple
    cik: 320193
    fye_sec: "0926"  # SEC fiscalYearEnd (MMDD) from the latest filing
    fye: last Saturday of September
    ir_url: https://investor.apple.com/
    tables:
      income: {title: "CONDENSED CONSOLIDATED STATEMENTS OF OPERATIONS"}
    lines:
      revenue_products: {label: "Products", section: "Net sales:"}
      revenue_services: {label: "Services", section: "Net sales:"}
      revenue_total: {label: ["Total net sales (1)", "Total net sales"], section: "Net sales:"}
      cost_products: {label: "Products", section: "Cost of sales:"}
      cost_services: {label: "Services", section: "Cost of sales:"}
      cost_of_revenue_total: {label: "Total cost of sales"}
      gross_profit: {label: "Gross margin"}
      opex_rd: {label: "Research and development"}
      opex_sga: {label: "Selling, general and administrative"}
      operating_expenses_total: {label: "Total operating expenses"}
      operating_income: {label: "Operating income"}
      other_income: {label: "Other income/(expense), net"}
      income_before_tax: {label: "Income before provision for income taxes"}
      income_tax: {label: "Provision for income taxes"}
      net_income: {label: "Net income"}
      eps_diluted: {label: "Diluted", section: "Earnings per share:", unit: USD/share}
    segments:
      - group: category
        table: income
        items:
          - {name: iPhone, label: "iPhone", section_contains: "by category"}
          - {name: Mac, label: "Mac", section_contains: "by category"}
          - {name: iPad, label: "iPad", section_contains: "by category"}
          - {name: "Wearables, Home and Accessories", short: "Wearables", label: "Wearables, Home and Accessories", section_contains: "by category"}
          - {name: Services, label: "Services", section_contains: "by category"}
        total: {label: "Total net sales", section_contains: "by category"}
      - group: geography
        table: income
        items:
          - {name: Americas, label: "Americas", section_contains: "by reportable segment"}
          - {name: Europe, label: "Europe", section_contains: "by reportable segment"}
          - {name: Greater China, label: "Greater China", section_contains: "by reportable segment"}
          - {name: Japan, label: "Japan", section_contains: "by reportable segment"}
          - {name: Rest of Asia Pacific, label: "Rest of Asia Pacific", section_contains: "by reportable segment"}
        total: {label: "Total net sales", section_contains: "by reportable segment"}
    show_segments: category
    verified: true  # CIK and fiscal year end confirmed with SEC data

